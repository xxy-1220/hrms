{% extends 'app01/base.html' %}
<!--
  ================================================================
  页面：attendance_form.html —— 考勤新增 / 编辑表单
  对应任务书：T6 考勤管理
  讲解要点（演示时照这个顺序讲）：
   1. 浏览器里是一张小表单卡片：选择员工、日期、上班时间、下班时间、备注，下面保存/取消。
   2. 同一员工同一天只允许一条考勤记录，重复提交会在字段上提示已存在。
   3. 不用手填状态：保存后后端按 09:00 / 18:00 自动判定，回列表能看到状态标签变了。
-->
{% block title %}{{ title }} · 企业员工管理系统{% endblock %}

{% block content %}
<div class="page-header-box">
    <div>
        <h3>{{ title }}</h3>
        <div class="sub">上传时间需与员工、日期组合唯一；状态将按 09:00 / 18:00 自动判定</div>
    </div>
    <a href="{% url 'attendance_list' %}" class="btn btn-default">
        <span class="glyphicon glyphicon-arrow-left"></span> 返回列表
    </a>
</div>

<div class="panel-card form-panel">
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="{% url 'attendance_list' %}" class="btn btn-default">取消</a>
        </div>
    </form>
</div>
{% endblock %}
